name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run unit tests
        run: |
          make test-unit
      - name: Validate backend entrypoint shim
        run: |
          python -c "from server.app.main import app; import server.run"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run integration tests
        run: |
          make test-integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
      working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: calma-ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose config
        run: docker compose -f compose.yaml config
      - name: Build Docker images
        run: docker compose -f compose.yaml build
      - name: Seed backend store volume
        run: docker compose -f compose.yaml -f compose.tools.yaml run --rm init-store
      - name: Start Docker stack
        run: docker compose -f compose.yaml up -d
      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend health endpoint did not become available in time."
          exit 1
      - name: Wait for backend readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ready | grep '"ready":true'; then
              exit 0
            fi
            sleep 2
          done
          echo "Backend readiness endpoint did not report ready=true in time."
          exit 1
      - name: Verify frontend root
        run: |
          curl -fsS http://localhost:8080/ | grep -i "<!doctype html>"
      - name: Print compose logs on failure
        if: failure()
        run: docker compose -f compose.yaml logs --no-color
      - name: Stop Docker stack
        if: always()
        run: docker compose -f compose.yaml down -v
